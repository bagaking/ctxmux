[workspace]
resolver = "3"
members = [
  "crates/ctxmux",
  "crates/ctxmux-client",
  "crates/ctxmux-daemon",
  "crates/ctxmux-protocol",
  "crates/ctxmux-sqlite-status",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/bagaking/ctxmux"

[workspace.dependencies]
crossterm = "0.29.0"
futures-util = { version = "0.3.31", features = ["sink"] }
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["event", "fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
