[workspace]
resolver = "3"
members = [
  "crates/ctxmux",
  "crates/ctxmux-client",
  "crates/ctxmux-daemon",
  "crates/ctxmux-inherited-fd",
  "crates/ctxmux-pty-signal",
  "crates/ctxmux-process-stats",
  "crates/ctxmux-rss-sampler",
  "crates/ctxmux-protocol",
  "crates/ctxmux-remote",
  "crates/ctxmux-sqlite-status",
  "crates/ctxmux-test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
repository = "https://github.com/bagaking/ctxmux"
license = "Apache-2.0"

[workspace.dependencies]
# portable-pty's public error type. The daemon needs it by name to walk an
# openpty failure's source chain back to a typed errno instead of matching on a
# rendered message; see `pty_open_error`.
anyhow = "1.0.104"
base64 = "0.22.1"
crossterm = "0.29.0"
vt100 = "0.15.2"
futures-util = { version = "0.3.31", features = ["sink"] }
libc = "0.2.183"
portable-pty = "0.9.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.4", features = ["event", "fs", "pipe", "process", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sysinfo = { version = "0.39.3", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

# Local fork of portable-pty 0.9.0, differing in one function.
#
# Upstream's `close_random_fds` runs in the child of every spawn and closes each
# descriptor above stdio by enumerating /dev/fd. That is O(open fds) per launch,
# so a process holding many descriptors gets quadratically slower at spawning —
# the daemon keeps 3 per live Run, and at 32k Runs each spawn walked a 96k-entry
# table (~290ms, measured). The fork uses close_range(2) on Linux: one syscall,
# 3-7us at every table size measured. It also fixes a failing execve being
# reported as a successful spawn (wezterm#7893). See third_party/portable-pty/
# src/unix.rs for the full rationale.
#
# There is nothing to upgrade to: 0.9.0 is the newest published version and the
# function is unchanged upstream since 2020. The patch also has to live outside
# the workspace, because `unsafe_code = "forbid"` above applies to members and
# the fix needs the `pre_exec` the dependency already owns.
[patch.crates-io]
portable-pty = { path = "third_party/portable-pty" }
