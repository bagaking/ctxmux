name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  critical:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            tmux_lane: minimum-3.4
          - os: macos-15
            tmux_lane: current
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CTXMUX_FUZZ_CASES: "512"
      CTXMUX_MODEL_CASES: "8"
      CTXMUX_REQUIRE_TMUX: "1"
      CTXMUX_TMUX_BIN: tmux
      CTXMUX_TMUX_QUALIFICATION: ${{ matrix.tmux_lane }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install required real tmux
        run: |
          if [[ "$CTXMUX_TMUX_QUALIFICATION" == "minimum-3.4" ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends tmux
          else
            brew update
            if brew list --versions tmux >/dev/null; then
              brew upgrade tmux
            else
              brew install tmux
            fi
          fi
          command -v tmux

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check workspace
        env:
          BASH_ENV: /dev/null
          CTXMUX_FUZZ_CASES: "512"
          CTXMUX_MODEL_CASES: "8"
          CTXMUX_REQUIRE_TMUX: "1"
          CTXMUX_TMUX_BIN: tmux
          CTXMUX_TMUX_QUALIFICATION: ${{ matrix.tmux_lane }}
          ENV: /dev/null
        run: unset BASH_ENV ENV GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM "${!GIT_CONFIG_KEY_@}" "${!GIT_CONFIG_VALUE_@}" && test "$(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_NOSYSTEM=1 /usr/bin/git rev-parse HEAD)" = "${{ github.sha }}" && test -z "$(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_NOSYSTEM=1 /usr/bin/git -c core.excludesFile=/dev/null -c core.fsmonitor=false -c core.untrackedCache=false status --porcelain --untracked-files=all)" && exec /bin/bash --noprofile --norc scripts/check.sh

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CTXMUX_FUZZ_CASES: "512"
      CTXMUX_MODEL_CASES: "8"
      CTXMUX_REQUIRE_TMUX: "1"
      CTXMUX_TMUX_BIN: tmux
      CTXMUX_TMUX_QUALIFICATION: minimum-3.4

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain and coverage support
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools-preview
          cargo install --locked --version 0.8.7 cargo-llvm-cov

      - name: Install required real tmux
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tmux
          command -v tmux

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check coverage policy
        env:
          BASH_ENV: /dev/null
          CTXMUX_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CTXMUX_COVERAGE_CHANGED_LINE_MODE: auto
          CTXMUX_COVERAGE_COMPARISON_MODE: ${{ github.event_name == 'pull_request' && 'merge-base' || 'direct' }}
          CTXMUX_FUZZ_CASES: "512"
          CTXMUX_MODEL_CASES: "8"
          CTXMUX_REQUIRE_TMUX: "1"
          CTXMUX_TMUX_BIN: tmux
          CTXMUX_TMUX_QUALIFICATION: minimum-3.4
          ENV: /dev/null
        run: unset BASH_ENV ENV GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM "${!GIT_CONFIG_KEY_@}" "${!GIT_CONFIG_VALUE_@}" && test "$(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_NOSYSTEM=1 /usr/bin/git rev-parse HEAD)" = "${{ github.sha }}" && test -z "$(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_NOSYSTEM=1 /usr/bin/git -c core.excludesFile=/dev/null -c core.fsmonitor=false -c core.untrackedCache=false status --porcelain --untracked-files=all)" && exec /bin/bash --noprofile --norc scripts/check.sh --coverage
