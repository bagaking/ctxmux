[package]
name = "ctxmux-daemon"
description = "Long-lived local runtime daemon for ctxmux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ctxmuxd"
path = "src/main.rs"

[dependencies]
ctxmux-protocol = { path = "../ctxmux-protocol" }
ctxmux-inherited-fd = { path = "../ctxmux-inherited-fd" }
ctxmux-sqlite-status = { path = "../ctxmux-sqlite-status" }
futures-util.workspace = true
portable-pty.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ctxmux-process-stats = { path = "../ctxmux-process-stats" }
ctxmux-pty-signal = { path = "../ctxmux-pty-signal" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
sysinfo.workspace = true

[lints]
workspace = true

[dev-dependencies]
ctxmux-client = { path = "../ctxmux-client" }
serde_json.workspace = true
tempfile.workspace = true
