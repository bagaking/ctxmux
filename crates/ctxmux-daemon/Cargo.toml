[package]
name = "ctxmux-daemon"
description = "Long-lived local runtime daemon for ctxmux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false
default-run = "ctxmuxd"

[[bin]]
name = "ctxmuxd"
path = "src/main.rs"

# Test-only stand-in for the system ssh client, needed by the remote-endpoint
# test lane. It must stay an ordinary bin of this crate: CARGO_BIN_EXE_fake-ssh
# is defined only for test targets of the crate declaring it, and gating it
# behind required-features makes the test compile and then fail at runtime with
# no binary. Release artifacts are bounded by the packaging allowlist in
# scripts/build-local-artifacts.mjs, which copies only ctxmux and ctxmuxd.
[[bin]]
name = "fake-ssh"
path = "src/bin/fake-ssh.rs"

[dependencies]
base64.workspace = true
ctxmux-protocol = { path = "../ctxmux-protocol" }
ctxmux-inherited-fd = { path = "../ctxmux-inherited-fd" }
ctxmux-sqlite-status = { path = "../ctxmux-sqlite-status" }
futures-util.workspace = true
portable-pty.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ctxmux-process-stats = { path = "../ctxmux-process-stats" }
ctxmux-pty-signal = { path = "../ctxmux-pty-signal" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
sysinfo.workspace = true

[lints]
workspace = true

[dev-dependencies]
ctxmux-client = { path = "../ctxmux-client" }
ctxmux-remote = { path = "../ctxmux-remote" }
ctxmux-test-support = { path = "../ctxmux-test-support" }
serde_json.workspace = true
tempfile.workspace = true
